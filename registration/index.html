<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registration</title>
  <link rel="icon" href="../common/img/favicon.svg">
  <link rel="stylesheet" href="../common/css/base.css">
  <link rel="stylesheet" href="../common/css/med.css">
</head>
<body data-root=".." data-widget="registration">
  <main class="page">
    <div class="page-head">
      <h1>Registration</h1>
      <p>Register a moving image onto a fixed one (rigid or affine).</p>
    </div>

    <div class="cols">
      <div>
        <section class="sec sec-input">
          <h2 class="sec-label">Input</h2>
          <div class="md-drops md-drops-3">
            <div id="drop-fixed"></div>
            <div id="drop-moving"></div>
            <div id="drop-seg"></div>
          </div>
          <div class="row">
            <label class="check" data-tip="Ticked: the output has F's voxel size. Unticked: M's own.">
              <input type="checkbox" id="match-spacing" checked> Match F's voxel resolution</label>
            <label class="check" data-tip="Ticked: the output has F's dimensions (voxels per axis). Unticked: as many voxels as hold the whole registered M. Either way, voxels beyond M take its nearest edge value.">
              <input type="checkbox" id="match-size" checked> Match F's dimension</label>
          </div>
          <div class="row">
            <span class="ctl-label" data-tip="Rigid: rotation + translation. Affine: a rigid stage first, then scaling and shear as well. Mattes mutual information, so F and M may differ in modality.">Method</span>
            <select id="mode" class="grow" aria-label="Method">
              <option>Rigid (6 DOF)</option>
              <option selected>Affine (12 DOF)</option>
            </select>
            <button type="button" class="btn primary" id="btn-run" disabled>Run</button>
          </div>
          <div class="hint" id="server-state"></div>
          <div class="status" id="status"></div>
        </section>

        <section class="sec hidden" id="sec-output">
          <h2 class="sec-label">Output</h2>
          <div id="summary"></div>
          <ul class="md-files" id="files"></ul>
        </section>

        <section class="sec hidden" id="sec-console">
          <h2 class="sec-label">Console</h2>
          <pre class="md-console" id="console"></pre>
        </section>
      </div>

      <div>
        <section class="sec sec-viewer">
          <h2 class="sec-label">Viewer</h2>
          <div class="row hidden" id="show-row">
            <span class="ctl-label" data-tip="Registered: M after registration. Before: M placed by its own header, as it came.">Moving</span>
            <select id="show" aria-label="Moving image shown">
              <option value="after">Registered</option>
              <option value="before">Before registration</option>
            </select>
            <span class="hint">red = fixed, green = moving, yellow = both</span>
          </div>
          <div id="view"></div>
          <div class="md-figure hidden" id="figure"></div>
        </section>
      </div>
    </div>
  </main>

  <script src="../common/registry.js"></script>
  <script src="../common/js/chrome.js"></script>
  <script src="../common/js/ui.js"></script>
  <script src="../common/js/pyclient.js"></script>
  <script src="../common/med/volume.js"></script>
  <script src="../common/med/io.js"></script>
  <script src="../common/med/io_nifti.js"></script>
  <script src="../common/med/io_nrrd.js"></script>
  <script src="../common/med/labels.js"></script>
  <script src="../common/med/render.js"></script>
  <script src="../common/med/viewer.js"></script>
  <script src="../common/med/sliceview.js"></script>
  <script src="lib/app.js"></script>
</body>
</html>
